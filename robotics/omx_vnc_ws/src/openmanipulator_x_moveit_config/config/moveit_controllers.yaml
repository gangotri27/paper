# Add this section at the very top of the file
trajectory_execution:
  allowed_execution_duration_scaling: 2.0  # Allow 2x the estimated time
  allowed_goal_duration_margin: 0.5        # Allow 0.5s extra delay
  execution_duration_monitoring: true

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4

  gripper_controller:
    action_ns: gripper_cmd
    type: GripperCommand
    default: true
    joints:
      - gripper_left_joint