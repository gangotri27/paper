# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    gripper_controller:
      type: position_controllers/GripperActionController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
gripper_controller:
  ros__parameters:
    update_rate: 10
    # Use 'joint' (singular) for GripperActionController
    joint: gripper_left_joint
    # Sometimes required parameters:
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 100.0
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0